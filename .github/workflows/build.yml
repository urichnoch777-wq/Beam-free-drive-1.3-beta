name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Последняя стабильная версия Godot на ноябрь 2026. Для обновления поменяйте номер.
  GODOT_VERSION: "4.7.2"
  EXPORT_NAME: SoftBeamDrive

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Найти проект Godot
        run: |
          NEED="project.godot main.tscn icon.svg scripts/boot.gd scripts/game.gd scripts/world.gd scripts/soft_car.gd scripts/hud.gd"
          missing() { local m=""; for f in $NEED; do [ -f "$1/$f" ] || m="$m $f"; done; echo "$m"; }
          D=""
          SRC="файлы репозитория"
          # 1) если в репозиторий загружен zip с проектом, берём его
          for Z in $(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*"); do
            if unzip -l "$Z" | grep -q "project.godot"; then
              rm -rf "$RUNNER_TEMP/zipproj"
              mkdir -p "$RUNNER_TEMP/zipproj"
              unzip -oq "$Z" -d "$RUNNER_TEMP/zipproj"
              P=$(find "$RUNNER_TEMP/zipproj" -name project.godot | head -n 1)
              if [ -n "$P" ]; then
                D=$(dirname "$P")
                SRC="архив $Z"
                break
              fi
            fi
          done
          # 2) иначе ищем project.godot в самом репозитории
          if [ -z "$D" ]; then
            if [ -f project.godot ]; then
              D="."
            else
              P=$(find . -maxdepth 3 -name project.godot -not -path "./.godot/*" | head -n 1)
              if [ -n "$P" ]; then D=$(dirname "$P"); fi
            fi
          fi
          if [ -z "$D" ]; then M=" project.godot"; else M=$(missing "$D"); fi
          if [ -n "$M" ]; then
            echo "::error::Не хватает файлов проекта:$M"
            {
              echo "### Не хватает файлов проекта"
              echo "$M"
              echo "Загрузите в корень репозитория архив softbeam-drive-godot.zip целиком: воркфлоу распакует его сам."
            } >> "$GITHUB_STEP_SUMMARY"
            find . -maxdepth 3 -not -path "./.git/*" | head -n 60
            exit 1
          fi
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          echo "Источник проекта: $SRC; папка: $D" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la "$D" "$D/scripts"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (пакеты из требований Godot)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo -E env "PATH=$PATH" "$SDKM" --licenses > /dev/null || true
          sudo -E env "PATH=$PATH" "$SDKM" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          ls "$ANDROID_HOME" "$ANDROID_HOME/build-tools"
          java -version

      - name: Godot и шаблоны экспорта
        run: |
          V="$GODOT_VERSION"
          URL="https://github.com/godotengine/godot-builds/releases/download/${V}-stable"
          cd "$RUNNER_TEMP"
          wget -q "$URL/Godot_v${V}-stable_linux.x86_64.zip"
          wget -q "$URL/Godot_v${V}-stable_export_templates.tpz"
          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"
          sudo install -m 755 "Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${V}.stable"
          unzip -q "Godot_v${V}-stable_export_templates.tpz" -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${V}.stable/"
          godot --version

      - name: Debug-ключ подписи
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Настройка проекта для Android (ETC2/ASTC)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import re
          p = "project.godot"
          s = open(p, encoding="utf-8").read().replace("\r\n", "\n")
          key = "textures/vram_compression/import_etc2_astc"
          line = key + "=true"
          if re.search(r"^" + re.escape(key) + r"[ \t]*=", s, re.M):
              s = re.sub(r"^" + re.escape(key) + r"[ \t]*=.*$", line, s, flags=re.M)
          elif re.search(r"^\[rendering\][ \t]*$", s, re.M):
              s = re.sub(r"^\[rendering\][ \t]*$", "[rendering]\n\n" + line, s, count=1, flags=re.M)
          else:
              s = s.rstrip("\n") + "\n\n[rendering]\n\n" + line + "\n"
          open(p, "w", encoding="utf-8").write(s)
          print("project.godot: " + line)
          PY

      - name: Export preset (создать, если его нет в репозитории)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > "$RUNNER_TEMP/preset.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter="build/*"
          export_path="build/SoftBeamDrive.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=1
          version/name="1.0.0"
          package/unique_name="com.softbeam.drive"
          package/name="SoftBeam Drive"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_app_library=true
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          EOF
          if [ -f export_presets.cfg ]; then
            echo "export_presets.cfg найден в репозитории"
          else
            echo "export_presets.cfg не найден (шаблонный .gitignore Godot его исключает), создаю"
            cp "$RUNNER_TEMP/preset.cfg" export_presets.cfg
          fi

      - name: Импорт ресурсов
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --import 2>&1 | tee import.log || true
          {
            echo "### Импорт: ошибки скриптов и ресурсов"
            echo '```'
            grep -E "ERROR|SCRIPT ERROR|Parse Error" import.log | head -n 40 || echo "ошибок нет"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          S=$(ls "$HOME"/.config/godot/editor_settings-*.tres 2>/dev/null | head -n 1 || true)
          if [ -n "$S" ]; then
            printf '\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\n' "$JAVA_HOME" "$ANDROID_HOME" >> "$S"
          fi

      - name: Экспорт debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build
          set +e
          godot --headless --export-debug "Android" "build/${EXPORT_NAME}-debug.apk" 2>&1 | tee export.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ] || [ ! -f "build/${EXPORT_NAME}-debug.apk" ]; then
            {
              echo "### Экспорт не удался (код $RC)"
              echo '```'
              grep -v "^$" export.log | tail -n 30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            MSG=$(grep -v "^$" export.log | tail -n 18 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Экспорт Godot не удался::$MSG"
            exit 1
          fi
          ls -lh build

      - name: Экспорт release APK (если заданы секреты)
        if: env.KEYSTORE_B64 != ''
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          godot --headless --export-release "Android" "build/${EXPORT_NAME}-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-apk
          path: ${{ env.PROJECT_DIR }}/build/*.apk

      - name: GitHub Release (при теге v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/build/*.apk
          
